[package]
name = "sigmaos-audit"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Audit and compliance system"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-audit"
readme = "README.md"
keywords = ["audit", "compliance", "security"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-security = { version = "0.1", path = "../SigmaOS-security" }

[profile.release]
opt-level = 3
